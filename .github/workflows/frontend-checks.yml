# Frontend checks (issue #106): lint, type-check and unit tests on every push to
# develop or main and every PR to develop. Work here is usually merged locally, so
# the push trigger is what makes this run; a failure shows on GitHub and blocks
# nothing. Backend pytest is not run here (it needs a Postgres service).
name: Frontend checks

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci, as the lab PC's update.ps1 does: fails if package.json and
      # package-lock.json disagree (CLAUDE.md, frontend dependency rule).
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
